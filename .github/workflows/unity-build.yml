name: Unity Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: ci/build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate project and MCP configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Content Packages/manifest.json -Raw | ConvertFrom-Json | Out-Null
          $settings = Get-Content ProjectSettings/McpUnitySettings.json -Raw | ConvertFrom-Json
          if ($settings.AllowRemoteConnections -ne $false) {
            throw 'MCP must remain loopback-only by default.'
          }
          if ($settings.AllowPackageInstallation -ne $false) {
            throw 'MCP package installation must remain disabled.'
          }
          if ($settings.Port -ne 8090) {
            throw 'MCP port must be 8090.'
          }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/Setup-LiveUnityMcp.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
          $editorVersion = (Select-String -Path 'ProjectSettings/ProjectVersion.txt' -Pattern '^m_EditorVersion:\s*(\S+)\s*$').Matches[0].Groups[1].Value
          foreach ($doc in @('README.md', 'docs/LIVE_EDITOR_ONBOARDING.md')) {
            $stale = Select-String -Path $doc -Pattern '6000\.\d+\.\d+[abfp]\d+' |
              Where-Object { $_.Matches[0].Value -ne $editorVersion }
            if ($stale) {
              throw "$doc references a Unity version other than $editorVersion (from ProjectVersion.txt): $($stale.Matches[0].Value)"
            }
          }
          Write-Host "Project JSON, MCP security defaults, PowerShell syntax, and documented Unity version ($editorVersion) are valid."

  build:
    name: Unity Build (WebGL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check Unity license availability
        id: license
        shell: bash
        env:
          HAS_LICENSE_FILE: ${{ secrets.UNITY_LICENSE != '' }}
          HAS_SERIAL: ${{ secrets.UNITY_SERIAL != '' }}
        run: |
          if [[ "$HAS_LICENSE_FILE" == "true" || "$HAS_SERIAL" == "true" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Unity build skipped: configure UNITY_LICENSE or UNITY_SERIAL to enable licensed CI builds."
          fi

      - name: Checkout
        if: steps.license.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        if: steps.license.outputs.available == 'true'
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Packages/manifest.json') }}
          restore-keys: |
            Library-

      - name: Resolve Unity version
        id: unity
        if: steps.license.outputs.available == 'true'
        shell: bash
        run: |
          version=$(sed -n 's/^m_EditorVersion: //p' ProjectSettings/ProjectVersion.txt | tr -d '\r')
          echo "Building with Unity $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build WebGL
        if: steps.license.outputs.available == 'true'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ steps.unity.outputs.version }}
          targetPlatform: WebGL
          buildMethod: BuildScript.PerformWebGLBuild
          projectPath: .
          allowDirtyBuild: true

      - name: Upload Build Artifact
        if: steps.license.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: WebGL-Build
          path: Builds/WebGL
          retention-days: 7
